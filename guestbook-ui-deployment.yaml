apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-guestbook-ui
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - image: nginx:1.23.1
          name: guestbook-ui
          ports:
            - containerPort: 80
